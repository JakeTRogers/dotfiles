name: gitstatusd

# Builds the patched gitstatusd (see omz/gitstatusd/README.md) and checks that
# it reads repos with relative worktrees. A gitstatusd-v* tag also publishes
# the binary as a release, which omz/gitstatusd/gitstatusd.env then pins.

on:
  push:
    tags: [ 'gitstatusd-v*' ]
  pull_request:
    paths: [ 'omz/gitstatusd/**', '.github/workflows/gitstatusd.yml' ]
  workflow_dispatch:

concurrency:
  group: gitstatusd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Build
      run: omz/gitstatusd/build.sh out
    - name: Test
      run: omz/gitstatusd/test.sh out/gitstatusd-linux-x86_64
    - name: Write checksum
      working-directory: out
      run: |
        sha256sum gitstatusd-linux-x86_64 > gitstatusd-linux-x86_64.sha256
        cat gitstatusd-linux-x86_64.sha256 >> "${GITHUB_STEP_SUMMARY}"
    - name: Upload binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: gitstatusd
        path: out/
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/gitstatusd-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: gitstatusd
        path: out
    - name: Publish release
      working-directory: out
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        chmod +x gitstatusd-linux-x86_64
        version="$(./gitstatusd-linux-x86_64 --version)"
        # powerlevel10k starts gitstatusd only when its version matches the
        # gitstatus it bundles, so the tag must name the version it was built as
        case "${TAG}" in
          "gitstatusd-${version}-"*) ;;
          *) echo "::error::tag ${TAG} does not match the built version ${version}; use gitstatusd-${version}-<n>"; exit 1 ;;
        esac
        sha256="$(cut -d' ' -f1 gitstatusd-linux-x86_64.sha256)"
        notes="gitstatusd ${version} with libgit2 patched to accept extensions.relativeWorktrees. See omz/gitstatusd/README.md.

        To install it, set in omz/gitstatusd/gitstatusd.env:

            release_tag='${TAG}'
            release_sha256='${sha256}'"
        gh release create "${TAG}" gitstatusd-linux-x86_64 gitstatusd-linux-x86_64.sha256 \
          --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes "${notes}" --latest=false
