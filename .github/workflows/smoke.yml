name: Install Smoke Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev container; also covers apt for Debian-based Lab servers. Required.
          - image: ubuntu:24.04
            experimental: false
          # Lab server (RHEL 9). Advisory, because getRelease API rate limits can flake.
          - image: rockylinux:9
            experimental: true
          # zypper coverage. No machine runs SUSE in Minimal mode; the Leap
          # Workstation runs Full mode. Advisory.
          - image: opensuse/leap:15.6
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Bootstrap container prerequisites
      shell: sh
      # tar/gzip are required by getRelease/install.sh. No sudo: as root the
      # Installer elevates nothing, and getRelease installs without sudo
      run: |
        if command -v apt-get > /dev/null; then
          apt-get update -qq && apt-get install -y -qq git ca-certificates tar gzip
        elif command -v dnf > /dev/null; then
          dnf install -q -y git ca-certificates tar gzip
        elif command -v zypper > /dev/null; then
          zypper -nq install git ca-certificates tar gzip
        else
          echo "no supported package manager found" && exit 1
        fi
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Run installer (minimal mode)
      # getRelease calls the GitHub API, which allows only 60 unauthenticated
      # requests per hour per IP, shared by every job on the runner's IP. The
      # job's read-only token raises that. Only this step gets it, under a
      # name that only getRelease reads.
      env:
        GETRELEASE_TOKEN: ${{ github.token }}
      run: ./install.sh
    - name: Verify install results
      # The checks live in a #!/bin/sh script so the shellcheck hook catches
      # bashisms; the container runs steps under sh, which is dash on Ubuntu
      run: sh bin/smoke_verify
