name: Version Bump Check

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  version-check:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0              # full history and tags, to find the unreleased commits
        persist-credentials: false  # the action runs tools on PR-controlled files
    - name: Check version bump
      uses: JakeTRogers/version-bump-checker@8b8bbfd58986f48a0f0846bb1f715459ba55d9db  # v1.0.0
