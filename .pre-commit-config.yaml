default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: d910b66e2686a3ef6c3f438dec0f63ba3cf8d7ee  # frozen: v4.18.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        # shellcheck cannot parse zsh; zsh files are covered by the zsh-syntax hook.
        # omz/{install,configure}.sh are zsh, fzf-git.sh is vendored, git-template
        # hooks are pre-commit-generated shims
        exclude_types: [ zsh ]
        exclude: ^(omz/(install|configure)\.sh|fzf/fzf-git\.sh|git/git-template/hooks/.*)$
  - repo: local
    hooks:
      - id: zsh-syntax
        name: zsh syntax check (zsh -n)
        language: system
        entry: bin/zsh_syntax_check
        files: ^(omz/(functions|completions)/[^/]+|omz/zshrc|omz/(install|configure)\.sh|.*\.zsh)$
      - id: zsh-function-test
        name: zsh function correctness checks
        # `zsh -n` above only parses. This runs the functions: it catches
        # variables leaked into the caller's shell, source patterns that are
        # always wrong, and regressions in the shared helpers' behaviour.
        language: system
        entry: bin/zsh_function_test
        files: ^omz/functions/[^/]+$
      - id: cheatsheet-audit
        name: cheatsheet drift check
        # `cheat` builds itself from function docstrings and alias comments, so
        # a missing one silently drops the entry; README.md restates the same
        # data by hand. This fails the commit instead of letting either rot.
        language: system
        entry: bin/cheatsheet_audit
        pass_filenames: false
        files: ^(omz/(aliases\.zsh|README\.md|functions/[^/]+)|fzf/[^/]+\.zsh)$
